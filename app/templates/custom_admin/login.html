
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Shylu Threads</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{% static 'app/css/custom_admin/style.css' %}">

</head>


<body class="login-page">


<div class="login-background">

    <div class="login-decoration decoration-one"></div>
    <div class="login-decoration decoration-two"></div>


    <div class="login-card">


        <div class="login-logo">

            <div class="login-logo-mark">
                S
            </div>

            <div>

                <strong>
                    Shylu Threads
                </strong>

                <span>
                    BOUTIQUE STUDIO
                </span>

            </div>

        </div>


        <div class="login-heading">

            <span>
                ADMINISTRATOR
            </span>

            <h1>
                Welcome back.
            </h1>

            <p>
                Sign in to manage your boutique.
            </p>

        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="login-error">

                    <i class="bi bi-exclamation-circle"></i>

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">


            <div class="login-field">

                <label>
                    Username
                </label>

                <div class="input-wrapper">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <div class="login-field">

                <label>
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <button type="submit"
                    class="login-button">

                Sign In

                <i class="bi bi-arrow-right"></i>

            </button>


        </form>


        <div class="login-footer">

            <i class="bi bi-shield-check"></i>

            <span>
                Secure administrator access
            </span>

        </div>


    </div>

</div>


</body>

</html>
