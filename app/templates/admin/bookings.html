{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookings | Smart Tailor Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <p class="section-label mb-2">Admin View</p>
          <h1 class="h3 mb-0">Consultation Bookings</h1>
        </div>
        <a href="../index.html" class="btn btn-outline-dark">Back to Store</a>
      </div>
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body">
          <div id="bookingsList" class="row g-3"></div>
        </div>
      </div>
    </div>
    <script src="../js/storage.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const bookingsList = document.getElementById('bookingsList');
        const bookings = getStorage('consultationRequests') || [];
        if (!bookings.length) {
          bookingsList.innerHTML = '<div class="col-12"><div class="alert alert-info mb-0">No consultation bookings yet.</div></div>';
          return;
        }

        bookingsList.innerHTML = bookings.map((booking) => `
          <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 h-100">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                  <div>
                    <h5 class="mb-1">${booking.name}</h5>
                    <p class="text-muted mb-0">${booking.email}</p>
                  </div>
                  <span class="badge bg-gold text-dark">${booking.service || 'Consultation'}</span>
                </div>
                <ul class="list-unstyled mt-3 small text-muted">
                  <li><strong>Phone:</strong> ${booking.phone || 'N/A'}</li>
                  <li><strong>Preferred Date:</strong> ${booking.preferredDate || 'Flexible'}</li>
                  <li><strong>Time:</strong> ${booking.createdAt}</li>
                </ul>
                <p class="mb-0 mt-2">${booking.message}</p>
              </div>
            </div>
          </div>
        `).join('');
      });
    </script>
  </body>
</html>
