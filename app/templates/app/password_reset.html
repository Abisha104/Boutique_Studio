{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Shylu Threads Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
   <link rel="stylesheet" href="{% static 'app/css/password_reset/style.css' %}">
</head>
<body>
    <div class="reset-card">
        <a href="{% url 'home' %}" class="brand-icon">Smart <span>Tailor</span></a>
        <h1 class="reset-title">Reset Password</h1>
        <p class="reset-sub">Enter your email address and we’ll send you a link to reset your password.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert custom-alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label">Email Address</label>
                <input type="email" name="email" id="id_email" class="form-control" placeholder="you@example.com" required autofocus>
            </div>
            <button type="submit" class="btn-reset">Send Reset Link</button>
        </form>
        <a href="{% url 'login' %}" class="back-link"><i class="bi bi-arrow-left"></i> Back to Login</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
